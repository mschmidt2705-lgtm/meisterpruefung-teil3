<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meisterprüfung Teil III — Prüfungswerkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2B45;
  --ink-2:#26375A;
  --paper:#F2ECDD;
  --paper-dim:#E4DCC6;
  --brass:#B8862F;
  --brass-light:#D6A94F;
  --ok:#4C6B4F;
  --warn:#8B3A2E;
  --text-on-paper:#241E14;
  --text-on-ink:#EDE6D2;
  --c-bwl:#7A5B3A;
  --c-recht:#3E5C76;
  --c-personal:#7A3B3B;
  --c-steuer:#4C6B4F;
  --c-marketing:#8B6A2E;
  --radius:2px;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(circle at 20% 10%, #223757 0%, var(--ink) 45%, #16223A 100%);
  color:var(--text-on-ink);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh;
}
.wrap{max-width:1100px;margin:0 auto;padding:32px 20px 80px;}

/* HEADER */
header.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  padding-bottom:28px;
  border-bottom:1px solid rgba(237,230,210,0.18);
  margin-bottom:28px;
}
.title-block h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:clamp(24px,4vw,34px);
  margin:0 0 4px;
  letter-spacing:0.2px;
}
.title-block .subtitle{
  font-size:13px;
  color:#B9AF93;
  letter-spacing:0.4px;
  text-transform:uppercase;
}
.seal{
  position:relative;
  width:88px;height:88px;
  border-radius:50%;
  border:2px solid var(--brass);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  background:radial-gradient(circle at 35% 30%, #2E3F63, #1A2740);
  box-shadow: inset 0 0 0 1px rgba(214,169,79,0.25), 0 0 0 6px rgba(184,134,47,0.06);
}
.seal .pct{
  font-family:'IBM Plex Mono', monospace;
  font-weight:600;
  font-size:20px;
  color:var(--brass-light);
}
.seal svg{position:absolute; top:-2px; left:-2px;}
.seal .ring-bg{stroke:rgba(237,230,210,0.12);}
.seal .ring-fg{stroke:var(--brass-light); transition:stroke-dashoffset 0.6s ease;}

/* TABS */
nav.tabs{
  display:flex;
  gap:6px;
  margin-bottom:28px;
  flex-wrap:wrap;
}
nav.tabs button{
  font-family:'IBM Plex Sans', sans-serif;
  font-size:13.5px;
  font-weight:500;
  letter-spacing:0.2px;
  padding:10px 18px;
  border:1px solid rgba(237,230,210,0.2);
  border-bottom:none;
  background:rgba(237,230,210,0.04);
  color:#C9BFA3;
  cursor:pointer;
  border-radius:var(--radius) var(--radius) 0 0;
  transition:background 0.15s, color 0.15s;
}
nav.tabs button:hover{background:rgba(237,230,210,0.09); color:var(--paper);}
nav.tabs button.active{
  background:var(--paper);
  color:var(--text-on-paper);
  font-weight:600;
}

/* PANEL */
.panel{
  background:var(--paper);
  color:var(--text-on-paper);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:32px;
  min-height:420px;
}
.panel h2{
  font-family:'Fraunces', serif;
  font-size:22px;
  font-weight:600;
  margin:0 0 4px;
}
.panel .lede{color:#5C5341; font-size:14px; margin-bottom:24px;}

/* DASHBOARD CARDS */
.cat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
.cat-card{
  border:1px solid var(--paper-dim);
  border-left:5px solid var(--accent);
  background:#fff8;
  padding:16px 18px;
  border-radius:var(--radius);
  cursor:pointer;
  transition:transform 0.12s, box-shadow 0.12s;
}
.cat-card:hover{transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,0.12);}
.cat-card .name{font-weight:600; font-size:14.5px; margin-bottom:10px;}
.cat-card .bar-bg{height:7px; background:var(--paper-dim); border-radius:4px; overflow:hidden;}
.cat-card .bar-fg{height:100%; background:var(--accent); border-radius:4px; transition:width 0.4s;}
.cat-card .stat{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:#6b6045; margin-top:8px;}

/* FLASHCARDS */
.fc-select{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
.fc-select button{
  padding:7px 14px; border-radius:20px; border:1px solid var(--paper-dim);
  background:transparent; font-size:12.5px; cursor:pointer; color:#5C5341;
}
.fc-select button.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.card-stage{display:flex; flex-direction:column; align-items:center; gap:18px;}
.flashcard{
  width:100%; max-width:560px; min-height:200px;
  background:#fff; border:1px solid var(--paper-dim);
  border-radius:6px; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:28px; cursor:pointer; position:relative;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  perspective:1000px;
}
.flashcard .face{font-size:17px; line-height:1.5;}
.flashcard .hint{position:absolute; bottom:10px; right:14px; font-size:10.5px; color:#a89c78; letter-spacing:0.3px;}
.flashcard.is-answer .face{color:var(--ink-2); font-weight:500;}
.stamp-mark{
  position:absolute; top:10px; left:14px; font-family:'IBM Plex Mono',monospace;
  font-size:11px; padding:3px 8px; border-radius:3px; opacity:0; transform:scale(1.4) rotate(-8deg);
  transition:opacity 0.25s, transform 0.25s;
}
.stamp-mark.show{opacity:1; transform:scale(1) rotate(-8deg);}
.stamp-mark.known{border:1.5px solid var(--ok); color:var(--ok);}
.stamp-mark.unknown{border:1.5px solid var(--warn); color:var(--warn);}
.fc-actions{display:flex; gap:12px;}
.fc-actions button{
  font-family:'IBM Plex Sans'; font-weight:600; font-size:13px;
  padding:10px 20px; border-radius:4px; cursor:pointer; border:1.5px solid transparent;
}
.btn-unknown{background:transparent; border-color:var(--warn); color:var(--warn);}
.btn-known{background:transparent; border-color:var(--ok); color:var(--ok);}
.btn-unknown:hover{background:var(--warn); color:#fff;}
.btn-known:hover{background:var(--ok); color:#fff;}
.fc-progress{font-family:'IBM Plex Mono', monospace; font-size:12px; color:#6b6045;}

/* QUIZ */
.quiz-setup{display:flex; flex-direction:column; gap:16px; max-width:480px;}
.quiz-setup select, .quiz-setup .num-input{
  padding:10px; border:1px solid var(--paper-dim); border-radius:4px; font-family:inherit; font-size:14px;
}
.quiz-timer{
  font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600;
  color:var(--ink); padding:6px 14px; border:1.5px solid var(--ink); border-radius:4px;
  display:inline-block;
}
.quiz-timer.low{color:var(--warn); border-color:var(--warn);}
.quiz-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.q-text{font-size:16.5px; font-weight:500; margin-bottom:18px; line-height:1.5;}
.q-options{display:flex; flex-direction:column; gap:10px;}
.q-option{
  text-align:left; padding:12px 16px; border:1px solid var(--paper-dim); border-radius:4px;
  background:#fff; cursor:pointer; font-size:14px; font-family:inherit;
}
.q-option:hover{border-color:var(--brass);}
.q-option.correct{border-color:var(--ok); background:#eaf1ea;}
.q-option.wrong{border-color:var(--warn); background:#f6e9e7;}
.q-explain{margin-top:14px; font-size:13px; color:#5c5341; background:var(--paper-dim); padding:12px 14px; border-radius:4px;}
.quiz-nav{margin-top:20px; display:flex; justify-content:flex-end;}
.quiz-nav button, .quiz-setup button{
  font-family:'IBM Plex Sans'; font-weight:600; font-size:13.5px;
  padding:10px 22px; border-radius:4px; border:none; background:var(--ink); color:var(--paper); cursor:pointer;
}
.quiz-result{text-align:center; padding:20px 0;}
.quiz-result .big{font-family:'Fraunces',serif; font-size:44px; font-weight:600; color:var(--ink);}

/* GLOSSAR */
.glossar-search{
  width:100%; padding:11px 14px; border:1px solid var(--paper-dim); border-radius:4px;
  font-family:inherit; font-size:14px; margin-bottom:20px;
}
.glossar-list dt{font-weight:600; margin-top:16px; color:var(--ink-2);}
.glossar-list dd{margin:4px 0 0; font-size:13.5px; color:#3d3626; line-height:1.5;}
.g-cat-tag{font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:#a89c78; margin-left:8px;}

footer.note{
  text-align:center; font-size:11.5px; color:#8a8064; margin-top:26px; line-height:1.6;
}
@media (max-width:600px){
  .panel{padding:20px 16px;}
  header.app-header{flex-direction:column; align-items:flex-start;}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="app-header">
    <div class="title-block">
      <div class="subtitle">Prüfungswerkstatt</div>
      <h1>Meisterprüfung Teil III</h1>
    </div>
    <div class="seal">
      <svg width="88" height="88">
        <circle class="ring-bg" cx="44" cy="44" r="38" fill="none" stroke-width="3"></circle>
        <circle id="ringFg" class="ring-fg" cx="44" cy="44" r="38" fill="none" stroke-width="3"
          stroke-dasharray="238.76" stroke-dashoffset="238.76" transform="rotate(-90 44 44)"></circle>
      </svg>
      <div class="pct" id="overallPct">0%</div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="dashboard" class="active">Übersicht</button>
    <button data-view="flashcards">Lernkarten</button>
    <button data-view="quiz">Klausursimulation</button>
    <button data-view="glossar">Glossar</button>
  </nav>

  <div class="panel" id="panel"></div>

  <footer class="note">
    Dein Fortschritt wird lokal in diesem Browser gespeichert (localStorage) — sobald du die Seite selbst hostest,
    bleibt er dort dauerhaft erhalten. Diese Vorschau hier im Chat kann den Speicher ggf. nicht behalten.
  </footer>
</div>

<script>

const DATA = {

        {q:'Wozu dient die Handwerksrolle?', a:'Verzeichnis der zulassungspflichtigen Handwerksbetriebe bei der Handwerkskammer; Eintragung ist Voraussetzung für die selbstständige Ausübung eines zulassungspflichtigen Handwerks.'},

/* ---------------- STORAGE ---------------- */
const STORAGE_KEY = 'meister3_progress_v1';
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {flash:{}, quizHistory:[]};
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
let progress = loadProgress();

/* ---------------- HELPERS ---------------- */
function catFlashStats(cat){
  const total = cat.flashcards.length;
  let known = 0;
  cat.flashcards.forEach((fc,i)=>{
    const key = cat.id+'_'+i;
    if(progress.flash[key] === 'known') known++;
  });
  return {known, total};
}
function overallProgressPct(){
  let known=0, total=0;
  DATA.categories.forEach(cat=>{
    const s = catFlashStats(cat);
    known += s.known; total += s.total;
  });
  return total ? Math.round(known/total*100) : 0;
}
function updateSeal(){
  const pct = overallProgressPct();
  document.getElementById('overallPct').textContent = pct+'%';
  const circumference = 238.76;
  const offset = circumference - (circumference*pct/100);
  document.getElementById('ringFg').style.strokeDashoffset = offset;
}

/* ---------------- VIEW ROUTER ---------------- */
const panel = document.getElementById('panel');
let currentView = 'dashboard';

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentView = btn.dataset.view;
  render();
});

function render(){
  if(currentView==='dashboard') renderDashboard();
  else if(currentView==='flashcards') renderFlashcards();
  else if(currentView==='quiz') renderQuiz();
  else if(currentView==='glossar') renderGlossar();
  updateSeal();
}

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
  let cards = DATA.categories.map(cat=>{
    const s = catFlashStats(cat);
    const pct = s.total ? Math.round(s.known/s.total*100) : 0;
    return `<div class="cat-card" style="--accent:${cat.accent}" data-cat="${cat.id}">
      <div class="name">${cat.name}</div>
      <div class="bar-bg"><div class="bar-fg" style="width:${pct}%"></div></div>
      <div class="stat">${s.known}/${s.total} Lernkarten sicher &middot; ${pct}%</div>
    </div>`;
  }).join('');
  panel.innerHTML = `
    <h2>Übersicht</h2>
    <p class="lede">Dein Stand pro Themenbereich. Klick auf einen Bereich, um direkt mit den Lernkarten zu starten.</p>
    <div class="cat-grid">${cards}</div>
  `;
  panel.querySelectorAll('.cat-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      fcState.catId = el.dataset.cat;
      fcState.index = 0;
      fcState.showAnswer = false;
      document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
      document.querySelector('[data-view="flashcards"]').classList.add('active');
      currentView='flashcards';
      render();
    });
  });
}

/* ---------------- FLASHCARDS ---------------- */
let fcState = {catId: DATA.categories[0].id, index:0, showAnswer:false, lastMark:null};

function renderFlashcards(){
  const cat = DATA.categories.find(c=>c.id===fcState.catId);
  const selectBtns = DATA.categories.map(c=>
    `<button data-cat="${c.id}" class="${c.id===cat.id?'active':''}">${c.name}</button>`
  ).join('');

  const fc = cat.flashcards[fcState.index];
  const key = cat.id+'_'+fcState.index;
  const mark = progress.flash[key];
  const s = catFlashStats(cat);

  panel.innerHTML = `
    <h2>Lernkarten</h2>
    <p class="lede">Karte antippen zum Umdrehen. Danach ehrlich einschätzen, ob du es sicher weißt.</p>
    <div class="fc-select">${selectBtns}</div>
    <div class="card-stage">
      <div class="flashcard ${fcState.showAnswer?'is-answer':''}" id="fcCard">
        <span class="stamp-mark ${mark==='known'?'known show':''} ${mark==='unknown'?'unknown show':''}">${mark==='known'?'BEHERRSCHT':(mark==='unknown'?'ÜBEN':'')}</span>
        <div class="face">${fcState.showAnswer ? fc.a : fc.q}</div>
        <div class="hint">${fcState.showAnswer ? 'Antwort — Klick für Frage' : 'Frage — Klick für Antwort'}</div>
      </div>
      <div class="fc-actions">
        <button class="btn-unknown">Nochmal üben</button>
        <button class="btn-known">Kenn ich sicher</button>
      </div>
      <div class="fc-progress">Karte ${fcState.index+1} / ${cat.flashcards.length} &middot; ${s.known}/${s.total} sicher in diesem Bereich</div>
    </div>
  `;

  panel.querySelectorAll('.fc-select button').forEach(b=>{
    b.addEventListener('click', ()=>{
      fcState.catId=b.dataset.cat; fcState.index=0; fcState.showAnswer=false; render();
    });
  });
  document.getElementById('fcCard').addEventListener('click', ()=>{
    fcState.showAnswer = !fcState.showAnswer;
    render();
  });
  panel.querySelector('.btn-known').addEventListener('click', ()=>{
    progress.flash[key]='known'; saveProgress(); nextCard(cat);
  });
  panel.querySelector('.btn-unknown').addEventListener('click', ()=>{
    progress.flash[key]='unknown'; saveProgress(); nextCard(cat);
  });
}
function nextCard(cat){
  fcState.index = (fcState.index+1) % cat.flashcards.length;
  fcState.showAnswer = false;
  render();
}

/* ---------------- QUIZ ---------------- */
let quizState = null;

function renderQuiz(){
  if(!quizState || quizState.stage==='setup'){
    const opts = DATA.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    panel.innerHTML = `
      <h2>Klausursimulation</h2>
      <p class="lede">Wähle einen Bereich (oder alle gemischt) und ein Zeitlimit. So übst du echten Prüfungsdruck.</p>
      <div class="quiz-setup">
        <label>Bereich<br>
          <select id="quizCat">
            <option value="all">Alle Bereiche gemischt</option>
            ${opts}
          </select>
        </label>
        <label>Zeitlimit pro Frage (Sekunden)<br>
          <input class="num-input" id="quizTime" type="number" value="45" min="10" max="180" style="width:100px">
        </label>
        <button id="startQuiz">Klausur starten</button>
      </div>
    `;
    document.getElementById('startQuiz').addEventListener('click', ()=>{
      const catId = document.getElementById('quizCat').value;
      const timeLimit = parseInt(document.getElementById('quizTime').value)||45;
      let pool = [];
      if(catId==='all'){
        DATA.categories.forEach(c=> c.quiz.forEach(q=> pool.push({...q, cat:c.name})));
      } else {
        const c = DATA.categories.find(c=>c.id===catId);
        c.quiz.forEach(q=> pool.push({...q, cat:c.name}));
      }
      pool = pool.sort(()=>Math.random()-0.5);
      quizState = {stage:'running', pool, i:0, correctCount:0, timeLimit, timeLeft:timeLimit, timer:null, answered:false, wrongList:[]};
      startTimer();
      renderQuiz();
    });
    return;
  }

  if(quizState.stage==='running'){
    const q = quizState.pool[quizState.i];
    const timerClass = quizState.timeLeft<=10 ? 'quiz-timer low' : 'quiz-timer';
    panel.innerHTML = `
      <div class="quiz-head">
        <h2 style="margin:0">Frage ${quizState.i+1} / ${quizState.pool.length}</h2>
        <span class="${timerClass}" id="timerDisp">${quizState.timeLeft}s</span>
      </div>
      <p class="lede" style="margin-bottom:6px">${q.cat}</p>
      <div class="q-text">${q.q}</div>
      <div class="q-options" id="qOptions">
        ${q.options.map((o,i)=>`<button class="q-option" data-i="${i}">${o}</button>`).join('')}
      </div>
      <div id="qExplainWrap"></div>
      <div class="quiz-nav"><button id="nextQ" style="display:none">Nächste Frage</button></div>
    `;
    panel.querySelectorAll('.q-option').forEach(btn=>{
      btn.addEventListener('click', ()=> answerQuestion(parseInt(btn.dataset.i)));
    });
    document.getElementById('nextQ').addEventListener('click', nextQuestion);
    return;
  }

  if(quizState.stage==='result'){
    const pct = Math.round(quizState.correctCount/quizState.pool.length*100);
    panel.innerHTML = `
      <h2>Ergebnis</h2>
      <div class="quiz-result">
        <div class="big">${pct}%</div>
        <p>${quizState.correctCount} von ${quizState.pool.length} Fragen richtig beantwortet.</p>
        ${quizState.wrongList.length ? `<p class="lede">Nochmal ansehen: ${quizState.wrongList.map(w=>w.cat).join(', ')}</p>` : '<p class="lede">Stark — alles richtig!</p>'}
        <button id="restartQuiz" style="margin-top:14px">Neue Klausur starten</button>
      </div>
    `;
    document.getElementById('restartQuiz').addEventListener('click', ()=>{ quizState={stage:'setup'}; renderQuiz(); });
  }
}

function startTimer(){
  clearInterval(quizState.timer);
  quizState.timeLeft = quizState.timeLimit;
  quizState.answered = false;
  quizState.timer = setInterval(()=>{
    quizState.timeLeft--;
    const disp = document.getElementById('timerDisp');
    if(disp){
      disp.textContent = quizState.timeLeft+'s';
      if(quizState.timeLeft<=10) disp.classList.add('low');
    }
    if(quizState.timeLeft<=0){
      clearInterval(quizState.timer);
      if(!quizState.answered) answerQuestion(-1);
    }
  },1000);
}

function answerQuestion(chosenIdx){
  if(quizState.answered) return;
  quizState.answered = true;
  clearInterval(quizState.timer);
  const q = quizState.pool[quizState.i];
  const options = document.querySelectorAll('.q-option');
  options.forEach((btn,i)=>{
    if(i===q.correct) btn.classList.add('correct');
    else if(i===chosenIdx) btn.classList.add('wrong');
    btn.disabled = true;
  });
  if(chosenIdx===q.correct){
    quizState.correctCount++;
  } else {
    quizState.wrongList.push(q);
  }
  document.getElementById('qExplainWrap').innerHTML = `<div class="q-explain">${q.explain}</div>`;
  document.getElementById('nextQ').style.display = 'inline-block';
}

function nextQuestion(){
  quizState.i++;
  if(quizState.i >= quizState.pool.length){
    quizState.stage='result';
    progress.quizHistory.push({date:new Date().toISOString(), pct:Math.round(quizState.correctCount/quizState.pool.length*100)});
    saveProgress();
    renderQuiz();
  } else {
    startTimer();
    renderQuiz();
  }
}

/* ---------------- GLOSSAR ---------------- */
function renderGlossar(){
  panel.innerHTML = `
    <h2>Glossar</h2>
    <p class="lede">Nachschlagewerk aller Fachbegriffe. Einfach tippen zum Filtern.</p>
    <input class="glossar-search" id="gSearch" placeholder="Begriff suchen…">
    <dl class="glossar-list" id="gList"></dl>
  `;
  const allTerms = [];
  DATA.categories.forEach(c=> c.glossary.forEach(g=> allTerms.push({...g, cat:c.name})));
  allTerms.sort((a,b)=>a.t.localeCompare(b.t,'de'));

  function draw(filter){
    const f = (filter||'').toLowerCase();
    const list = document.getElementById('gList');
    const filtered = allTerms.filter(t => t.t.toLowerCase().includes(f) || t.d.toLowerCase().includes(f));
    list.innerHTML = filtered.map(t=>`<dt>${t.t}<span class="g-cat-tag">${t.cat}</span></dt><dd>${t.d}</dd>`).join('') || '<p class="lede">Keine Treffer.</p>';
  }
  draw('');
  document.getElementById('gSearch').addEventListener('input', e=> draw(e.target.value));
}

/* ---------------- INIT ---------------- */
render();
</script>
